<style>
*{box-sizing:border-box} :root{--bg:#070b16;--panel:#0e1526;--panel2:#111d32;--ink:#f6f8ff;--muted:#8994ad;--line:#a3b5db24;--cyan:#5ee6e0;--blue:#7895ff;--green:#62d5a1;--yellow:#f4c66d;--red:#ef7d86;--sans:Manrope,sans-serif;--display:'Space Grotesk',sans-serif;--mono:'DM Mono',monospace}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);overflow-x:hidden}.ambient{position:fixed;border-radius:50%;filter:blur(110px);opacity:.12;pointer-events:none;z-index:-1}.a1{width:420px;height:420px;background:#384fc9;top:-170px;right:8%}.a2{width:340px;height:340px;background:#08a99b;bottom:-100px;left:-180px}.topbar{height:78px;padding:0 4vw;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#070b16d9;backdrop-filter:blur(18px);z-index:5}.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);font:700 15px var(--display);letter-spacing:.1em}.brand-mark{width:28px;height:28px;border:1px solid #5ee6e08c;border-radius:8px;display:grid;place-items:center;color:var(--cyan)}.accent{color:var(--cyan)}.top-actions{display:flex;align-items:center;gap:22px}.top-actions button{background:none;color:var(--ink);border:0;cursor:pointer}.bell{font-size:23px;position:relative}.dot{position:absolute;width:7px;height:7px;background:var(--cyan);border:2px solid var(--bg);border-radius:50%;right:-1px;top:0}.profile{display:flex;align-items:center;gap:9px;font-weight:700;font-size:12px}.avatar{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f1b8aa,#b77dff);color:#17172a;font-size:10px}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 78px)}.sidebar{border-right:1px solid var(--line);padding:34px 18px;display:flex;flex-direction:column}.label,.kicker{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.label{padding:0 14px;margin-bottom:22px}.nav{display:grid;gap:5px}.nav a,.signout{padding:13px 14px;border:0;border-radius:8px;color:var(--muted);background:none;text-align:left;text-decoration:none;font:600 12px var(--sans);cursor:pointer}.nav a span,.signout span{display:inline-block;width:23px;color:#74809a;font-size:17px}.nav a.active{color:var(--ink);border-left:2px solid var(--cyan);background:linear-gradient(90deg,#7895ff2e,transparent)}.nav a.active span{color:var(--cyan)}.nav b{float:right;border-radius:12px;padding:1px 7px;background:var(--cyan);color:#071319;font-size:10px}.side-bottom{margin-top:auto}.trust{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:13px 10px;margin-bottom:16px}.trust strong,.trust small{display:block;font-size:10px}.trust small{color:var(--muted);margin-top:2px}.shield{color:var(--cyan);font-size:20px}.main{max-width:1500px;width:100%;padding:48px 5vw 90px}.welcome{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:34px}.welcome h1{font:600 clamp(28px,3vw,43px)/1.1 var(--display);letter-spacing:-.035em;margin:8px 0}.lede{color:var(--muted);margin:0}.live{color:var(--cyan);border:1px solid #5ee6e044;border-radius:20px;padding:4px 8px;font:500 9px var(--mono);margin-left:9px}.live i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--cyan);margin-right:5px}.btn{border:0;border-radius:7px;padding:12px 17px;display:inline-flex;gap:16px;align-items:center;justify-content:center;cursor:pointer;font:700 11px var(--sans);transition:.2s}.btn:hover{transform:translateY(-2px)}.primary{color:#071319;background:var(--cyan)}.secondary,.outline{color:var(--ink);background:#ffffff0b;border:1px solid var(--line)}.metric-grid{display:grid;grid-template-columns:1.5fr .8fr .8fr;gap:14px}.wallet{min-height:220px;border-radius:14px;padding:25px 28px;overflow:hidden;position:relative;background:linear-gradient(125deg,#182c6b,#172657 48%,#312166);box-shadow:0 20px 45px #0d185b40}.wallet-top,.wallet-bottom{position:relative;z-index:1;display:flex;justify-content:space-between}.wallet-label{color:#b7c1e5;font:500 10px var(--mono);letter-spacing:.08em}.wallet-brand{font:600 11px var(--display);letter-spacing:.1em}.balance{font:600 clamp(30px,4vw,46px) var(--display);letter-spacing:-.04em;margin:31px 0}.balance small{font-size:.55em;color:#bbc6e9}.wallet-bottom small,.wallet-bottom strong{display:block;font-size:10px}.wallet-bottom small{color:#aebbe4}.card-number{align-self:end;color:#b7c5ec;font:11px var(--mono);letter-spacing:.15em}.orbit{position:absolute;border:1px solid #bfd0ff33;border-radius:50%;width:270px;height:270px;right:-90px;bottom:-160px}.orbit.two{width:390px;height:390px;right:-120px;bottom:-240px}.metric{min-height:220px;padding:24px;border:1px solid var(--line);border-radius:14px;background:#0e1526cc;display:flex;flex-direction:column;justify-content:flex-end}.metric-icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:20px;margin-bottom:auto}.green{color:var(--green);background:#62d5a11f}.blue{color:var(--blue);background:#7895ff1f}.metric strong{font:600 25px var(--display);margin:7px 0}.metric small{color:var(--muted);font-size:11px}.up{color:var(--green);font-weight:700}.actions{display:flex;align-items:center;justify-content:space-between;padding:26px 0;border-bottom:1px solid var(--line)}.actions h2,.head h2,.profile h2{font:600 19px var(--display);margin:3px 0}.actions p,.profile p{color:var(--muted);font-size:12px;margin:3px 0}.action-btns{display:flex;gap:9px}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.72fr);gap:20px;padding-top:34px}.panel{border:1px solid var(--line);border-radius:14px;background:#0a101eb3;padding:26px}.head{display:flex;justify-content:space-between;align-items:center}.progress{font:600 25px var(--display);color:var(--cyan)}.progress small{color:var(--muted);font-size:12px}.track,.mini-track{height:4px;background:#202a40;border-radius:4px;overflow:hidden;margin:23px 0}.track i{display:block;width:20%;height:100%;background:var(--cyan)}.tasks{display:grid;gap:10px}.task{display:flex;align-items:center;gap:17px;min-height:84px;padding:17px 14px;border:1px solid var(--line);border-radius:10px}.task.available{border-color:#5ee6e073;background:linear-gradient(90deg,#5ee6e012,transparent)}.task-no{align-self:flex-start;padding-top:4px;color:var(--muted);font:500 12px var(--mono)}.task.available .task-no{color:var(--cyan)}.task-copy{flex:1;min-width:0}.task-title{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.task h3{font:600 14px var(--display);margin:0}.task p{font-size:11px;color:var(--muted);margin:5px 0}.status{padding:4px 7px;border-radius:4px;font:500 9px var(--mono)}.status.available{color:var(--cyan);background:#5ee6e01a}.status.locked{color:#77839d;background:#182237}.task-meta{display:flex;gap:15px;color:#8390ab;font:10px var(--mono);margin-top:9px}.task button{border:0;background:none;color:var(--cyan);font:600 11px var(--sans);cursor:pointer;white-space:nowrap}.lock{color:#66728c;font-size:18px}.side{display:grid;gap:20px;align-content:start}.insight{padding:26px;border-radius:14px;border:1px solid #7895ff40;background:linear-gradient(145deg,#16234b,#111728)}.spark{color:var(--cyan);font-size:22px;margin-bottom:30px}.insight h3{font:600 23px/1.1 var(--display);margin:9px 0 15px}.insight h3 em{color:var(--cyan);font-style:normal}.insight p:not(.kicker){color:var(--muted);font-size:11px}.mini-track{margin-top:25px}.mini-track i{display:block;width:0;height:100%;background:var(--cyan)}.insight small{color:#73809b;font:10px var(--mono)}.activity a{color:var(--cyan);font-size:10px;text-decoration:none}.item{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:16px 0 0;margin-top:12px}.item-icon{width:31px;height:31px;border-radius:8px;display:grid;place-items:center}.item strong,.item small{display:block;font-size:10px}.item small{color:var(--muted);margin-top:3px}.item time{margin-left:auto;color:#74809b;font:10px var(--mono);align-self:flex-start}.profile{display:flex;align-items:center;gap:14px;margin-top:20px;padding:20px 24px;background:#0e15268c;border:1px solid var(--line);border-radius:14px}.profile .avatar{width:44px;height:44px}.profile .btn{margin-left:auto}.fab{position:fixed;right:25px;bottom:25px;z-index:4;border:1px solid #5ee6e04d;border-radius:25px;padding:12px 15px;background:#101c30;color:var(--ink);display:flex;gap:9px;align-items:center;font:600 11px var(--sans);cursor:pointer;box-shadow:0 10px 30px #0006}.fab .dot{position:static;border:0;box-shadow:0 0 10px var(--cyan)}.fab b{color:var(--cyan);font-size:17px}.mobile{display:none}.modal{display:none;position:fixed;inset:0;z-index:10;place-items:center;padding:20px;background:#02050ccc;backdrop-filter:blur(8px)}.modal.open{display:grid}.dialog{width:min(460px,100%);padding:30px;background:#10192d;border:1px solid var(--line);border-radius:15px;position:relative;box-shadow:0 25px 80px #0008}.close{position:absolute;right:14px;top:10px;background:none;border:0;color:var(--muted);font-size:25px;cursor:pointer}.dialog h2{font:600 24px var(--display);margin:5px 0}.dialog p{color:var(--muted);font-size:12px}.field{display:grid;gap:7px;margin:17px 0}.field label{color:var(--muted);font:500 10px var(--mono);text-transform:uppercase}.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:7px;background:#0a1222;color:var(--ink);font:12px var(--sans);outline:none}.field input:focus,.field select:focus{border-color:var(--cyan)}.dialog form .btn{width:100%;margin-top:5px}.demo-note{padding:10px;border:1px solid #f4c66d40;background:#f4c66d0d;color:var(--yellow)!important;border-radius:7px;font:10px var(--mono)!important}.support-copy{border-left:2px solid var(--cyan);padding-left:14px;margin:20px 0}.success{color:var(--cyan);font-size:30px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);padding:12px 16px;border:1px solid #5ee6e04d;border-radius:8px;background:#101c30;color:var(--ink);font-size:11px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{display:none}.main{padding:36px 24px 95px}.metric-grid{grid-template-columns:1fr 1fr}.wallet{grid-column:1/-1}.grid{grid-template-columns:1fr}.mobile{position:fixed;display:flex;bottom:0;left:0;right:0;height:67px;padding-top:9px;z-index:6;background:#0a101ef5;border-top:1px solid var(--line);justify-content:space-around}.mobile a{color:var(--muted);text-align:center;text-decoration:none;font-size:19px}.mobile a.active{color:var(--cyan)}.mobile small{display:block;font:9px var(--mono)}.fab{bottom:82px}.topbar{padding:0 24px}.profile-name{display:none}}@media(max-width:560px){.topbar{height:68px}.main{padding:30px 16px 100px}.welcome{display:block}.welcome .btn{margin-top:20px}.metric-grid{gap:10px}.metric{min-height:145px;padding:16px}.metric strong{font-size:20px}.wallet{min-height:200px;padding:21px}.balance{margin:26px 0 24px}.actions{display:block}.action-btns{margin-top:18px}.action-btns .btn{flex:1}.panel{padding:20px 15px}.task{gap:10px;padding:14px 9px}.task button{font-size:0}.task button span{font-size:18px}.side{grid-template-columns:1fr}.profile{padding:17px 14px}.profile .btn{font-size:0;padding:10px}.profile .btn span{font-size:16px}.fab{right:15px}.card-number{display:none}}
</style>

<body>
<div class="ambient a1"></div><div class="ambient a2"></div>
<div id="app"></div>
<div class="modal" id="modal" aria-hidden="true"><div class="dialog"><button class="close" id="close" aria-label="Close">×</button><div id="dialog-content"></div></div></div><div class="toast" id="toast" role="status"></div>
<script>
(() => {
'use strict';
const TELEGRAM_SUPPORT_URL = 'https://t.me/your_support';
const TASKS = [{title:'First steps',message:'Get familiar with your Asterra workspace and redeem your first code.',reward:500},{title:'Build momentum',message:'Complete this milestone to unlock the next step.',reward:500},{title:'Find your rhythm',message:'Your progress unlocks one step at a time.',reward:500},{title:'Raise the bar',message:'Almost there. Keep your streak alive.',reward:500},{title:'The finish line',message:'Complete every milestone to finish your journey.',reward:500}];
const DEMO_CODES = ['TASK1-DEMO','TASK2-DEMO','TASK3-DEMO','TASK4-DEMO','TASK5-DEMO'];
const KEYS = {user:'asterra-user',session:'asterra-session',progress:'asterra-progress',transactions:'asterra-transactions',deposits:'asterra-deposits',withdrawals:'asterra-withdrawals',notifications:'asterra-notifications'};
const $ = s => document.querySelector(s); const load = (key, fallback) => JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); const save = (key, value) => localStorage.setItem(key, JSON.stringify(value));
let user = load(KEYS.user, null); let progress = load(KEYS.progress, 0); let transactions = load(KEYS.transactions, []); let deposits = load(KEYS.deposits, []); let withdrawals = load(KEYS.withdrawals, []); let notifications = load(KEYS.notifications, ['Welcome to Asterra.','Task 1 is now available.']);
TASKS.map = function(renderTask){ return progress >= TASKS.length ? ['<article class="task available"><div class="success">✓</div><div class="task-copy"><div class="task-title"><h3>All Tasks Completed</h3><span class="status available">Complete</span></div><p>Every milestone is complete. Your journey is finished.</p></div></article>'] : [renderTask(TASKS[progress], progress)]; };
const money = n => `৳ ${Number(n).toLocaleString('en-BD',{minimumFractionDigits:2,maximumFractionDigits:2})}`; const initials = n => n.split(' ').map(x => x[0]).join('').slice(0,2).toUpperCase();
function persist(){save(KEYS.user,user);save(KEYS.progress,progress);save(KEYS.transactions,transactions);save(KEYS.deposits,deposits);save(KEYS.withdrawals,withdrawals);save(KEYS.notifications,notifications)}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}
function showDialog(html){$('#dialog-content').innerHTML=html;$('#modal').classList.add('open');$('#modal').setAttribute('aria-hidden','false')};function closeDialog(){$('#modal').classList.remove('open');$('#modal').setAttribute('aria-hidden','true')}
function renderAuth(){document.body.innerHTML=`<div class="ambient a1"></div><div class="ambient a2"></div><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section class="dialog" style="width:min(440px,100%)"><a class="brand" href="#"><span class="brand-mark">✦</span><span>ASTERRA<span class="accent">.</span></span></a><p class="kicker" style="margin-top:38px">SECURE CUSTOMER ACCESS</p><h1 style="font:600 34px var(--display);margin:8px 0">Your next step<br><span style="color:var(--cyan)">starts here.</span></h1><p>Sign in to your premium workspace or create a new account.</p><div class="field"><label>Mobile number</label><input id="auth-phone" type="tel" placeholder="01XXXXXXXXX"></div><div class="field"><label>Password</label><input id="auth-password" type="password" placeholder="8+ characters"></div><div style="display:grid;gap:9px"><button class="btn primary" id="login">Sign in <span>→</span></button><button class="btn outline" id="register">Create account <span>＋</span></button><button class="btn secondary" id="demo">Try demo account <span>✦</span></button></div><p class="demo-note" style="margin-top:18px">SANDBOX / DEMO MODE · No real payments are processed.</p></section></main>`;$('#login').onclick=login;$('#register').onclick=register;$('#demo').onclick=demo}
function login(){const phone=$('#auth-phone').value.trim();if(!/^01[3-9]\d{8}$/.test(phone))return toast('Enter a valid Bangladesh mobile number.');if(!$('#auth-password').value)return toast('Enter your password.');user={name:'Customer',phone,createdAt:new Date().toISOString(),balance:0,deposited:0,withdrawn:0};progress=0;persist();render();toast('Welcome back to Asterra.')}
function register(){const phone=$('#auth-phone').value.trim(),password=$('#auth-password').value;if(!/^01[3-9]\d{8}$/.test(phone)||password.length<8)return toast('Use a valid mobile number and 8+ character password.');user={name:'New Customer',phone,createdAt:new Date().toISOString(),balance:0,deposited:0,withdrawn:0};progress=0;persist();render();toast('Account created in demo mode.')}
function demo(){user={name:'Demo Customer',phone:'01700000000',createdAt:new Date().toISOString(),balance:0,deposited:0,withdrawn:0};progress=0;transactions=[];deposits=[];withdrawals=[];persist();render();toast('Demo workspace ready.')}
function render(){if(!user)return renderAuth();const done=progress*TASKS[0].reward,totalDeposited=user.deposited||0,totalWithdrawn=user.withdrawn||0;document.body.innerHTML=`<div class="ambient a1"></div><div class="ambient a2"></div><header class="topbar"><a class="brand" href="#top"><span class="brand-mark">✦</span><span>ASTERRA<span class="accent">.</span></span></a><div class="top-actions"><button class="bell" id="notifications" aria-label="Notifications">♢<span class="dot"></span></button><button class="profile"><span class="avatar">${initials(user.name)}</span><span class="profile-name">${user.name}</span><span>⌄</span></button></div></header><div class="shell"><aside class="sidebar"><div class="label">Customer workspace</div><nav class="nav"><a class="active" href="#dashboard"><span>◈</span> Overview</a><a href="#tasks"><span>◇</span> My tasks <b>${progress<5?1:0}</b></a><a href="#wallet"><span>◌</span> Wallet</a><a href="#activity"><span>≡</span> Activity</a><a href="#profile"><span>◎</span> Profile</a></nav><div class="side-bottom"><div class="trust"><span class="shield">✧</span><div><strong>Protected workspace</strong><small>Local demo session</small></div></div><button class="signout" id="support"><span>?</span> Help & support</button><button class="signout" id="logout"><span>↪</span> Sign out</button></div></aside><main class="main" id="dashboard"><section class="welcome"><div><p class="kicker">MONDAY, 24 AUGUST 2026 <span class="live"><i></i> Live</span></p><h1>Good morning, ${user.name.split(' ')[0]}.</h1><p class="lede">Your next milestone is within reach. Keep your momentum going.</p></div><button class="btn secondary" id="welcome-support">Need a hand? <span>↗</span></button></section><section class="metric-grid"><article class="wallet" id="wallet"><div class="wallet-top"><span class="wallet-label">TOTAL BALANCE　◉</span><span class="wallet-brand">✦ ASTERRA</span></div><div class="balance">${money(user.balance)}<small></small></div><div class="wallet-bottom"><div><small>Available to use</small><strong>${money(user.balance)}</strong></div><div class="card-number">SANDBOX</div></div><div class="orbit"></div><div class="orbit two"></div></article><article class="metric"><div class="metric-icon green">↗</div><span class="label">TOTAL DEPOSITED</span><strong>${money(totalDeposited)}</strong><small><b class="up">Sandbox ledger</b></small></article><article class="metric"><div class="metric-icon blue">↙</div><span class="label">TOTAL WITHDRAWN</span><strong>${money(totalWithdrawn)}</strong><small>Review required</small></article></section><section class="actions"><div><h2>Move money</h2><p>Requests stay pending in sandbox mode.</p></div><div class="action-btns"><button class="btn primary" id="deposit"><span>＋</span> Deposit</button><button class="btn outline" id="withdraw"><span>↗</span> Withdraw</button></div></section><section class="grid"><div class="panel" id="tasks"><div class="head"><div><p class="kicker">YOUR PROGRESS</p><h2>Five steps forward</h2></div><span class="progress">${String(progress+1).padStart(2,'0')} <small>/ 05</small></span></div><div class="track"><i style="width:${progress*20}%"></i></div><div class="tasks">${TASKS.map((task,i)=>{const state=i<progress?'COMPLETED':i===progress?'AVAILABLE':'LOCKED';return `<article class="task ${state==='AVAILABLE'?'available':''}"><div class="task-no">${String(i+1).padStart(2,'0')}</div><div class="task-copy"><div class="task-title"><h3>${task.title}</h3><span class="status ${state.toLowerCase()}">${state==='AVAILABLE'?'Available now':state[0]+state.slice(1).toLowerCase()}</span></div><p>${task.message}</p>${state==='AVAILABLE'?`<div class="task-meta"><span>◷ 5 min</span><span>✦ ${money(task.reward)} reward</span></div>`:''}</div>${state==='AVAILABLE'?`<button class="open-task">Open task <span>→</span></button>`:state==='COMPLETED'?'<span class="lock" style="color:var(--green)">✓</span>':'<span class="lock">⌑</span>'}</article>`}).join('')}</div></div><aside class="side"><section class="insight"><div class="spark">✦</div><p class="kicker">YOUR MOMENTUM</p><h3>One good step<br><em>leads to another.</em></h3><p>You've completed ${progress} of 5 tasks. Your next reward is waiting.</p><div class="mini-track"><i style="width:${progress*20}%"></i></div><small>${progress*20}% complete</small></section><section class="panel activity" id="activity"><div class="head"><div><p class="kicker">RECENT ACTIVITY</p><h2>Latest updates</h2></div><a href="#activity">View all</a></div>${transactions.length?transactions.slice(-3).reverse().map(t=>`<div class="item"><span class="item-icon ${t.type==='deposit'?'green':'blue'}">${t.type==='deposit'?'↗':'✦'}</span><div><strong>${t.label}</strong><small>${t.amount?money(t.amount):'Asterra workspace'}</small></div><time>${t.status}</time></div>`).join(''):'<p class="lede" style="padding-top:20px">No transactions yet.</p>'}</section></aside></section><section class="profile" id="profile"><div class="avatar">${initials(user.name)}</div><div><p class="kicker">ACCOUNT</p><h2>${user.name}</h2><p>${user.phone} · Demo account</p></div><button class="btn outline">Profile <span>↗</span></button></section></main></div><nav class="mobile"><a class="active" href="#dashboard">◈<small>Home</small></a><a href="#tasks">◇<small>Tasks</small></a><a href="#wallet">◌<small>Wallet</small></a><a href="#activity">≡<small>Activity</small></a><a href="#profile">◎<small>Profile</small></a></nav><button class="fab" id="fab"><span class="dot"></span><span>Support</span><b>↗</b></button><div class="toast" id="toast"></div>`;bind();}
function bind(){if(!$('#modal'))document.body.insertAdjacentHTML('beforeend','<div class="modal" id="modal" aria-hidden="true"><div class="dialog"><button class="close" id="close" aria-label="Close">×</button><div id="dialog-content"></div></div></div><div class="toast" id="toast" role="status"></div>');$('#close').onclick=closeDialog;$('#modal').onclick=e=>{if(e.target.id==='modal')closeDialog()};$('#deposit').onclick=deposit;$('#withdraw').onclick=withdraw;$('#fab').onclick=support;$('#support').onclick=support;$('#welcome-support').onclick=support;$('#logout').onclick=()=>{localStorage.removeItem(KEYS.session);user=null;render()};$('#notifications').onclick=()=>showDialog(`<p class="kicker">NOTIFICATIONS</p><h2>Updates</h2>${notifications.map(n=>`<p>• ${n}</p>`).join('')}`);document.querySelectorAll('.open-task').forEach(b=>b.onclick=()=>taskModal(progress))}
function deposit(){showDialog(`<p class="kicker">WALLET / ADD FUNDS</p><h2>Make a deposit</h2><p class="demo-note">SANDBOX / DEMO MODE · Balance will not increase automatically.</p><div class="field"><label>Payment method</label><select id="method"><option>bKash · 01700000000</option><option>Nagad · 01700000000</option><option>Rocket · 01700000000</option></select></div><div class="field"><label>Amount (BDT)</label><input id="amount" type="number" min="1" placeholder="e.g. 5,000"></div><div class="field"><label>Transaction ID / reference</label><input id="reference" placeholder="Your payment reference"></div><button class="btn primary" id="submit-deposit">Submit request <span>→</span></button>`);$('#submit-deposit').onclick=()=>{const amount=Number($('#amount').value);if(!amount||!$('#reference').value)return toast('Amount and reference are required.');deposits.push({amount,method:$('#method').value,reference:$('#reference').value,status:'pending',createdAt:new Date().toISOString()});transactions.push({type:'deposit',label:'Deposit request submitted',amount,status:'pending'});notifications.unshift('Your deposit request is pending.');persist();closeDialog();toast('Deposit submitted in sandbox mode.');render()}}
function withdraw(){showDialog(`<p class="kicker">WALLET / SEND FUNDS</p><h2>Request a withdrawal</h2><p>Available balance: <strong>${money(user.balance)}</strong></p><div class="field"><label>Amount (BDT)</label><input id="amount" type="number" min="1" max="${user.balance}" placeholder="e.g. 2,000"></div><div class="field"><label>Payment method</label><select id="method"><option>bKash</option><option>Nagad</option><option>Rocket</option></select></div><div class="field"><label>Destination number</label><input id="destination" type="tel" placeholder="01XXXXXXXXX"></div><button class="btn primary" id="submit-withdraw">Submit request <span>→</span></button>`);$('#submit-withdraw').onclick=()=>{const amount=Number($('#amount').value),destination=$('#destination').value.trim();if(!amount||amount>user.balance||!/^01[3-9]\d{8}$/.test(destination))return toast('Check amount and destination number.');withdrawals.push({amount,method:$('#method').value,destination,status:'pending'});transactions.push({type:'withdrawal',label:'Withdrawal request submitted',amount,status:'pending'});notifications.unshift('Your withdrawal request is pending.');persist();closeDialog();toast('Withdrawal submitted for review.');render()}}
function taskModal(index){const task=TASKS[index];showDialog(`<p class="kicker">TASK ${String(index+1).padStart(2,'0')} / MILESTONE</p><h2>${task.title}</h2><p>${task.message}</p><p class="demo-note">DEMO CODE: ${DEMO_CODES[index]}</p><div class="field"><label>Redeem code</label><input id="code" placeholder="ENTER CODE" autocomplete="off"></div><button class="btn primary" id="redeem">Redeem & complete <span>→</span></button>`);$('#redeem').onclick=()=>{if($('#code').value.trim().toUpperCase()!==DEMO_CODES[index])return toast('That redeem code is not valid.');progress++;user.balance+=task.reward;transactions.push({type:'task_reward',label:`Task ${index+1} completed`,amount:task.reward,status:'completed'});notifications.unshift('Task completed successfully.');persist();closeDialog();toast(`Task ${index+1} completed. Next step unlocked.`);render()}}
function support(){showDialog(`<p class="kicker">ASTERra SUPPORT</p><h2>Need help?</h2><div class="support-copy"><strong>Our support team is on Telegram.</strong><p>We can help with your account and pending requests.</p></div><button class="btn primary" id="telegram">Open Telegram <span>↗</span></button>`);$('#telegram').onclick=()=>window.open(TELEGRAM_SUPPORT_URL,'_blank','noopener,noreferrer')}
$('#close').onclick=closeDialog;$('#modal').onclick=e=>{if(e.target.id==='modal')closeDialog()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});new MutationObserver(()=>{const heading=$('#tasks .head h2'),counter=$('.progress');if(heading&&heading.textContent!=='Your next task')heading.textContent='Your next task';if(counter&&counter.textContent!=='Current task')counter.textContent='Current task'}).observe(document.body,{childList:true,subtree:true});render();
})();
</script>
</body>
