<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} :root{--bg:#070b16;--panel:#0e1526;--panel2:#111d32;--ink:#f6f8ff;--muted:#8994ad;--line:#a3b5db24;--cyan:#5ee6e0;--blue:#7895ff;--green:#62d5a1;--yellow:#f4c66d;--red:#ef7d86;--sans:Manrope,sans-serif;--display:'Space Grotesk',sans-serif;--mono:'DM Mono',monospace}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);overflow-x:hidden}.ambient{position:fixed;border-radius:50%;filter:blur(110px);opacity:.12;pointer-events:none;z-index:-1}.a1{width:420px;height:420px;background:#384fc9;top:-170px;right:8%}.a2{width:340px;height:340px;background:#08a99b;bottom:-100px;left:-180px}.topbar{height:78px;padding:0 4vw;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#070b16d9;backdrop-filter:blur(18px);z-index:5}.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);font:700 15px var(--display);letter-spacing:.1em}.brand-mark{width:28px;height:28px;border:1px solid #5ee6e08c;border-radius:8px;display:grid;place-items:center;color:var(--cyan)}.accent{color:var(--cyan)}.top-actions{display:flex;align-items:center;gap:22px}.top-actions button{background:none;color:var(--ink);border:0;cursor:pointer}.bell{font-size:23px;position:relative}.dot{position:absolute;width:7px;height:7px;background:var(--cyan);border:2px solid var(--bg);border-radius:50%;right:-1px;top:0}.profile{display:flex;align-items:center;gap:9px;font-weight:700;font-size:12px}.avatar{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f1b8aa,#b77dff);color:#17172a;font-size:10px}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 78px)}.sidebar{border-right:1px solid var(--line);padding:34px 18px;display:flex;flex-direction:column}.label,.kicker{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.label{padding:0 14px;margin-bottom:22px}.nav{display:grid;gap:5px}.nav a,.signout{padding:13px 14px;border:0;border-radius:8px;color:var(--muted);background:none;text-align:left;text-decoration:none;font:600 12px var(--sans);cursor:pointer}.nav a span,.signout span{display:inline-block;width:23px;color:#74809a;font-size:17px}.nav a.active{color:var(--ink);border-left:2px solid var(--cyan);background:linear-gradient(90deg,#7895ff2e,transparent)}.nav a.active span{color:var(--cyan)}.side-bottom{margin-top:auto}.trust{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:13px 10px;margin-bottom:16px}.trust strong,.trust small{display:block;font-size:10px}.trust small{color:var(--muted);margin-top:2px}.shield{color:var(--cyan);font-size:20px}.main{max-width:1500px;width:100%;padding:48px 5vw 90px}.welcome{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:34px}.welcome h1{font:600 clamp(28px,3vw,43px)/1.1 var(--display);letter-spacing:-.035em;margin:8px 0}.lede{color:var(--muted);margin:0}.live{color:var(--cyan);border:1px solid #5ee6e044;border-radius:20px;padding:4px 8px;font:500 9px var(--mono);margin-left:9px}.live i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--cyan);margin-right:5px}.btn{border:0;border-radius:7px;padding:12px 17px;display:inline-flex;gap:16px;align-items:center;justify-content:center;cursor:pointer;font:700 11px var(--sans);transition:.2s}.btn:hover{transform:translateY(-2px)}.primary{color:#071319;background:var(--cyan)}.secondary,.outline{color:var(--ink);background:#ffffff0b;border:1px solid var(--line)}.metric-grid{display:grid;grid-template-columns:1.5fr .8fr .8fr;gap:14px}.wallet{min-height:220px;border-radius:14px;padding:25px 28px;overflow:hidden;position:relative;background:linear-gradient(125deg,#182c6b,#172657 48%,#312166);box-shadow:0 20px 45px #0d185b40}.wallet-top,.wallet-bottom{position:relative;z-index:1;display:flex;justify-content:space-between}.wallet-label{color:#b7c1e5;font:500 10px var(--mono);letter-spacing:.08em}.wallet-brand{font:600 11px var(--display);letter-spacing:.1em}.balance{font:600 clamp(30px,4vw,46px) var(--display);letter-spacing:-.04em;margin:31px 0}.wallet-bottom small,.wallet-bottom strong{display:block;font-size:10px}.wallet-bottom small{color:#aebbe4}.card-number{align-self:end;color:#b7c5ec;font:11px var(--mono);letter-spacing:.15em}.orbit{position:absolute;border:1px solid #bfd0ff33;border-radius:50%;width:270px;height:270px;right:-90px;bottom:-160px}.orbit.two{width:390px;height:390px;right:-120px;bottom:-240px}.metric{min-height:220px;padding:24px;border:1px solid var(--line);border-radius:14px;background:#0e1526cc;display:flex;flex-direction:column;justify-content:flex-end}.metric-icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:20px;margin-bottom:auto}.green{color:var(--green);background:#62d5a11f}.blue{color:var(--blue);background:#7895ff1f}.metric strong{font:600 25px var(--display);margin:7px 0}.metric small{color:var(--muted);font-size:11px}.actions{display:flex;align-items:center;justify-content:space-between;padding:26px 0;border-bottom:1px solid var(--line)}.actions h2,.head h2,.profile h2{font:600 19px var(--display);margin:3px 0}.actions p,.profile p{color:var(--muted);font-size:12px;margin:3px 0}.action-btns{display:flex;gap:9px}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.72fr);gap:20px;padding-top:34px}.panel{border:1px solid var(--line);border-radius:14px;background:#0a101eb3;padding:26px}.head{display:flex;justify-content:space-between;align-items:center}.current-label{font:500 10px var(--mono);color:var(--cyan);text-transform:uppercase;letter-spacing:.08em}.track,.mini-track{height:4px;background:#202a40;border-radius:4px;overflow:hidden;margin:23px 0}.track i{display:block;height:100%;background:var(--cyan)}.task{display:flex;align-items:center;gap:17px;min-height:160px;padding:22px 18px;border:1px solid #5ee6e073;border-radius:10px;background:linear-gradient(90deg,#5ee6e012,transparent);animation:rise .45s ease both}.task-no{align-self:flex-start;padding-top:4px;color:var(--cyan);font:500 12px var(--mono)}.task-copy{flex:1;min-width:0}.task-title{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.task h3{font:600 18px var(--display);margin:0}.task p{font-size:12px;color:var(--muted);margin:8px 0 16px}.status{padding:4px 7px;border-radius:4px;color:var(--cyan);background:#5ee6e01a;font:500 9px var(--mono)}.task-details{display:flex;gap:24px;flex-wrap:wrap}.task-details div{display:grid;gap:3px}.task-details small{color:var(--muted);font:10px var(--mono);text-transform:uppercase}.task-details strong{font:600 15px var(--display)}.task button{white-space:nowrap}.requirement{display:grid;gap:13px;min-height:160px;padding:25px;border:1px solid #f4c66d55;border-radius:10px;background:linear-gradient(120deg,#f4c66d0d,transparent);animation:rise .45s ease both}.requirement h3{font:600 18px var(--display);margin:0}.requirement p{color:var(--muted);font-size:12px;margin:0}.requirement strong{color:var(--yellow)}.side{display:grid;gap:20px;align-content:start}.insight{padding:26px;border-radius:14px;border:1px solid #7895ff40;background:linear-gradient(145deg,#16234b,#111728)}.spark{color:var(--cyan);font-size:22px;margin-bottom:30px}.insight h3{font:600 23px/1.1 var(--display);margin:9px 0 15px}.insight h3 em{color:var(--cyan);font-style:normal}.insight p:not(.kicker){color:var(--muted);font-size:11px}.mini-track{margin-top:25px}.mini-track i{display:block;height:100%;background:var(--cyan)}.insight small{color:#73809b;font:10px var(--mono)}.activity a{color:var(--cyan);font-size:10px;text-decoration:none}.item{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:16px 0 0;margin-top:12px}.item-icon{width:31px;height:31px;border-radius:8px;display:grid;place-items:center}.item strong,.item small{display:block;font-size:10px}.item small{color:var(--muted);margin-top:3px}.item time{margin-left:auto;color:#74809b;font:10px var(--mono);align-self:flex-start}.profile{display:flex;align-items:center;gap:14px;margin-top:20px;padding:20px 24px;background:#0e15268c;border:1px solid var(--line);border-radius:14px}.profile .avatar{width:44px;height:44px}.profile .btn{margin-left:auto}.fab{position:fixed;right:25px;bottom:25px;z-index:4;border:1px solid #5ee6e04d;border-radius:25px;padding:12px 15px;background:#101c30;color:var(--ink);display:flex;gap:9px;align-items:center;font:600 11px var(--sans);cursor:pointer;box-shadow:0 10px 30px #0006}.fab .dot{position:static;border:0;box-shadow:0 0 10px var(--cyan)}.fab b{color:var(--cyan);font-size:17px}.mobile{display:none}.modal{display:none;position:fixed;inset:0;z-index:10;place-items:center;padding:20px;background:#02050ccc;backdrop-filter:blur(8px)}.modal.open{display:grid}.dialog{width:min(460px,100%);padding:30px;background:#10192d;border:1px solid var(--line);border-radius:15px;position:relative;box-shadow:0 25px 80px #0008}.close{position:absolute;right:14px;top:10px;background:none;border:0;color:var(--muted);font-size:25px;cursor:pointer}.dialog h2{font:600 24px var(--display);margin:5px 0}.dialog p{color:var(--muted);font-size:12px}.field{display:grid;gap:7px;margin:17px 0}.field label{color:var(--muted);font:500 10px var(--mono);text-transform:uppercase}.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:7px;background:#0a1222;color:var(--ink);font:12px var(--sans);outline:none}.field input:focus,.field select:focus{border-color:var(--cyan)}.dialog form .btn{width:100%;margin-top:5px}.notice{padding:10px;border:1px solid #f4c66d40;background:#f4c66d0d;color:var(--yellow)!important;border-radius:7px;font:10px var(--mono)!important}.support-copy{border-left:2px solid var(--cyan);padding-left:14px;margin:20px 0}.success{color:var(--cyan);font-size:30px}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{display:none}.main{padding:36px 24px 95px}.metric-grid{grid-template-columns:1fr 1fr}.wallet{grid-column:1/-1}.grid{grid-template-columns:1fr}.mobile{position:fixed;display:flex;bottom:0;left:0;right:0;height:67px;padding-top:9px;z-index:6;background:#0a101ef5;border-top:1px solid var(--line);justify-content:space-around}.mobile a{color:var(--muted);text-align:center;text-decoration:none;font-size:19px}.mobile a.active{color:var(--cyan)}.mobile small{display:block;font:9px var(--mono)}.fab{bottom:82px}.topbar{padding:0 24px}.profile-name{display:none}}@media(max-width:560px){.topbar{height:68px}.main{padding:30px 16px 100px}.welcome{display:block}.welcome .btn{margin-top:20px}.metric-grid{gap:10px}.metric{min-height:145px;padding:16px}.metric strong{font-size:20px}.wallet{min-height:200px;padding:21px}.balance{margin:26px 0 24px}.actions{display:block}.action-btns{margin-top:18px}.action-btns .btn{flex:1}.panel{padding:20px 15px}.task{gap:10px;padding:18px 12px}.task button{font-size:0}.task button span{font-size:18px}.profile{padding:17px 14px}.profile .btn{font-size:0;padding:10px}.profile .btn span{font-size:16px}.fab{right:15px}.card-number{display:none}}
</style>
</head>
<body>
<div class="ambient a1"></div><div class="ambient a2"></div><div id="app"></div>
<div class="modal" id="modal" aria-hidden="true"><div class="dialog"><button class="close" id="close" aria-label="Close">×</button><div id="dialog-content"></div></div></div><div class="toast" id="toast" role="status"></div>
<script>
(() => {'use strict';
/* Configuration */
const TELEGRAM_SUPPORT_URL='https://t.me/your_support';
const TASKS=[{title:'First steps',message:'Begin your journey and complete this first milestone.',requiredBalance:0,reward:50},{title:'Build momentum',message:'Keep your wallet ready to unlock the next milestone.',requiredBalance:500,reward:100},{title:'Find your rhythm',message:'Build on your progress and keep moving forward.',requiredBalance:1000,reward:200},{title:'Raise the bar',message:'You are close to the finish. Take the next step.',requiredBalance:2000,reward:300},{title:'The finish line',message:'Complete the final milestone in your journey.',requiredBalance:5000,reward:500}];
const KEYS={customer:'asterra-customer',session:'asterra-session',wallet:'asterra-wallet',tasks:'asterra-tasks',activity:'asterra-activity',deposits:'asterra-deposits',withdrawals:'asterra-withdrawals',notifications:'asterra-notifications'};
/* State helpers */
const $=selector=>document.querySelector(selector); const read=(key,fallback)=>{try{const raw=localStorage.getItem(key);return raw===null?fallback:JSON.parse(raw)}catch{localStorage.removeItem(key);return fallback}}; const write=(key,value)=>localStorage.setItem(key,JSON.stringify(value));
let customer=read(KEYS.customer,null),session=read(KEYS.session,null),wallet=read(KEYS.wallet,{balance:0,totalDeposited:0,totalWithdrawn:0,pending:0,rewards:0}),taskState=read(KEYS.tasks,{current:0,completed:[]}),activity=read(KEYS.activity,[]),deposits=read(KEYS.deposits,[]),withdrawals=read(KEYS.withdrawals,[]),notifications=read(KEYS.notifications,['Welcome to Asterra.','Task 1 is now available.']);
if(!customer||!session){customer=null;session=null} const saveState=()=>{write(KEYS.customer,customer);write(KEYS.session,session);write(KEYS.wallet,wallet);write(KEYS.tasks,taskState);write(KEYS.activity,activity);write(KEYS.deposits,deposits);write(KEYS.withdrawals,withdrawals);write(KEYS.notifications,notifications)}; const clearSession=()=>{localStorage.removeItem(KEYS.session);customer=null;session=null}; const money=value=>`৳ ${Number(value).toLocaleString('en-BD',{minimumFractionDigits:2,maximumFractionDigits:2})}`; const initials=name=>name.split(' ').map(part=>part[0]).join('').slice(0,2).toUpperCase();
function toast(message){const node=$('#toast');if(!node)return;node.textContent=message;node.classList.add('show');setTimeout(()=>node.classList.remove('show'),2600)} function openModal(html){$('#dialog-content').innerHTML=html;$('#modal').classList.add('open');$('#modal').setAttribute('aria-hidden','false')} function closeModal(){$('#modal').classList.remove('open');$('#modal').setAttribute('aria-hidden','true')}
/* Authentication */
function renderAuth(){document.body.innerHTML=`<div class="ambient a1"></div><div class="ambient a2"></div><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section class="dialog" style="width:min(440px,100%)"><a class="brand" href="#"><span class="brand-mark">✦</span><span>ASTERRA<span class="accent">.</span></span></a><p class="kicker" style="margin-top:38px">SECURE CUSTOMER ACCESS</p><h1 style="font:600 34px var(--display);margin:8px 0">Your next step<br><span style="color:var(--cyan)">starts here.</span></h1><p>Sign in to your Asterra customer workspace or create your account.</p><div id="register-fields" style="display:none"><div class="field"><label for="auth-name">Full name</label><input id="auth-name" placeholder="Your full name"></div></div><div class="field"><label for="auth-phone">Mobile number</label><input id="auth-phone" type="tel" placeholder="01XXXXXXXXX"></div><div class="field"><label for="auth-password">Password</label><input id="auth-password" type="password" placeholder="8+ characters"></div><div id="confirm-field" class="field" style="display:none"><label for="auth-confirm">Confirm password</label><input id="auth-confirm" type="password" placeholder="Repeat your password"></div><div style="display:grid;gap:9px"><button class="btn primary" id="auth-submit">Sign in <span>→</span></button><button class="btn outline" id="auth-toggle">Create account <span>＋</span></button></div><p class="notice" style="margin-top:18px">SANDBOX / FRONTEND PROTOTYPE · Payment requests require later backend verification.</p></section></main>`;let registerMode=false;$('#auth-toggle').onclick=()=>{registerMode=!registerMode;$('#register-fields').style.display=registerMode?'block':'none';$('#confirm-field').style.display=registerMode?'grid':'none';$('#auth-submit').innerHTML=registerMode?'Create account <span>→</span>':'Sign in <span>→</span>';$('#auth-toggle').innerHTML=registerMode?'Back to sign in <span>↩</span>':'Create account <span>＋</span>'};$('#auth-submit').onclick=()=>{const phone=$('#auth-phone').value.trim().replace(/\s+/g,''),password=$('#auth-password').value;if(!/^01[3-9]\d{8}$/.test(phone)||password.length<8)return toast('Enter a valid mobile number and 8+ character password.');if(registerMode){if(!$('#auth-name').value.trim()||password!==$('#auth-confirm').value)return toast('Name and matching passwords are required.');customer={name:$('#auth-name').value.trim(),phone,createdAt:new Date().toISOString(),status:'Active'};wallet={balance:0,totalDeposited:0,totalWithdrawn:0,pending:0,rewards:0};taskState={current:0,completed:[]};activity=[];deposits=[];withdrawals=[];notifications=['Welcome to Asterra.','Task 1 is now available.']}else{customer=read(KEYS.customer,null);if(!customer||customer.phone!==phone)return toast('No account found. Register first or check your number.');}session={active:true,createdAt:new Date().toISOString()};saveState();renderDashboard();toast(registerMode?'Account created successfully.':'Welcome back to Asterra.')}}
/* Dashboard rendering */
function currentTask(){return TASKS[taskState.current]} function taskArea(){if(taskState.current>=TASKS.length)return '<article class="task available"><div class="success">✓</div><div class="task-copy"><div class="task-title"><h3>All Tasks Completed</h3><span class="status">Complete</span></div><p>You have completed all available tasks.</p><div class="task-details"><div><small>Total task rewards</small><strong>'+money(wallet.rewards)+'</strong></div></div></div></article>';const task=currentTask();if(wallet.balance<task.requiredBalance)return `<section class="requirement"><p class="current-label">NEXT TASK LOCKED</p><h3>Increase your wallet balance to unlock your next task.</h3><p>Required wallet balance: <strong>${money(task.requiredBalance)}</strong></p><p>Current balance: <strong>${money(wallet.balance)}</strong></p><button class="btn outline" id="locked-support">View wallet options <span>→</span></button></section>`;return `<article class="task available"><div class="task-no">CURRENT</div><div class="task-copy"><div class="task-title"><h3>${task.title}</h3><span class="status">Available now</span></div><p>${task.message}</p><div class="task-details"><div><small>Reward</small><strong>${money(task.reward)}</strong></div><div><small>Wallet requirement</small><strong>${money(task.requiredBalance)}</strong></div><div><small>Current balance</small><strong>${money(wallet.balance)}</strong></div></div></div><button class="btn primary" id="complete-task">Complete task <span>→</span></button></article>`}
function renderDashboard(){if(!customer)return renderAuth();const completed=taskState.completed.length;document.body.innerHTML=`<header class="topbar"><a class="brand" href="#top"><span class="brand-mark">✦</span><span>ASTERRA<span class="accent">.</span></span></a><div class="top-actions"><button class="bell" id="notifications" aria-label="Notifications">♢<span class="dot"></span></button><button class="profile"><span class="avatar">${initials(customer.name)}</span><span class="profile-name">${customer.name}</span></button></div></header><div class="shell"><aside class="sidebar"><div class="label">Customer workspace</div><nav class="nav"><a class="active" href="#dashboard"><span>◈</span> Dashboard</a><a href="#tasks"><span>◇</span> Current task</a><a href="#wallet"><span>◌</span> Wallet</a><a href="#activity"><span>≡</span> Activity</a><a href="#profile"><span>◎</span> Profile</a></nav><div class="side-bottom"><div class="trust"><span class="shield">✧</span><div><strong>Protected workspace</strong><small>Frontend prototype</small></div></div><button class="signout" id="support"><span>?</span> Help & support</button><button class="signout" id="logout"><span>↪</span> Sign out</button></div></aside><main class="main" id="dashboard"><section class="welcome"><div><p class="kicker">CUSTOMER WORKSPACE <span class="live"><i></i> Active</span></p><h1>Good morning, ${customer.name.split(' ')[0]}.</h1><p class="lede">Your wallet and next milestone, in one clear view.</p></div><button class="btn secondary" id="welcome-support">Need a hand? <span>↗</span></button></section><section class="metric-grid"><article class="wallet" id="wallet"><div class="wallet-top"><span class="wallet-label">AVAILABLE BALANCE　◉</span><span class="wallet-brand">✦ ASTERRA</span></div><div class="balance">${money(wallet.balance)}</div><div class="wallet-bottom"><div><small>Pending amount</small><strong>${money(wallet.pending)}</strong></div><div class="card-number">SANDBOX</div></div><div class="orbit"></div><div class="orbit two"></div></article><article class="metric"><div class="metric-icon green">↗</div><span class="label">TOTAL DEPOSITED</span><strong>${money(wallet.totalDeposited)}</strong><small>Verified activity only</small></article><article class="metric"><div class="metric-icon blue">✦</div><span class="label">TASK REWARDS</span><strong>${money(wallet.rewards)}</strong><small>${completed} completed milestone${completed===1?'':'s'}</small></article></section><section class="actions"><div><h2>Move money</h2><p>Requests remain pending until backend verification.</p></div><div class="action-btns"><button class="btn primary" id="deposit"><span>＋</span> Deposit</button><button class="btn outline" id="withdraw"><span>↗</span> Withdraw</button></div></section><section class="grid"><div class="panel" id="tasks"><div class="head"><div><p class="kicker">PROGRESSIVE MISSION</p><h2>Your next task</h2></div><span class="current-label">${taskState.current>=TASKS.length?'COMPLETE':'CURRENT TASK'}</span></div><div class="track"><i style="width:${completed/TASKS.length*100}%"></i></div><div class="tasks">${taskArea()}</div></div><aside class="side"><section class="insight"><div class="spark">✦</div><p class="kicker">WALLET UNLOCK</p><h3>One clear step<br><em>at a time.</em></h3><p>${taskState.current>=TASKS.length?'Your full mission is complete.':'Your wallet balance controls when the next task becomes available.'}</p><div class="mini-track"><i style="width:${completed/TASKS.length*100}%"></i></div><small>${completed} milestone${completed===1?'':'s'} completed</small></section><section class="panel activity" id="activity"><div class="head"><div><p class="kicker">RECENT ACTIVITY</p><h2>Latest updates</h2></div><a href="#activity">View all</a></div>${activity.length?activity.slice(-3).reverse().map(item=>`<div class="item"><span class="item-icon ${item.type==='deposit'?'green':item.type==='withdrawal'?'blue':'green'}">${item.type==='deposit'?'↗':item.type==='withdrawal'?'↙':'✦'}</span><div><strong>${item.label}</strong><small>${item.amount?money(item.amount):'Asterra workspace'}</small></div><time>${item.status}</time></div>`).join(''):'<p class="lede" style="padding-top:20px">No activity yet.</p>'}</section></aside></section><section class="profile" id="profile"><div class="avatar">${initials(customer.name)}</div><div><p class="kicker">ACCOUNT</p><h2>${customer.name}</h2><p>${customer.phone} · ${customer.status} · Joined ${new Date(customer.createdAt).toLocaleDateString('en-GB')}</p></div></section></main></div><nav class="mobile"><a class="active" href="#dashboard">◈<small>Home</small></a><a href="#tasks">◇<small>Tasks</small></a><a href="#wallet">◌<small>Wallet</small></a><a href="#activity">≡<small>Activity</small></a><a href="#profile">◎<small>Profile</small></a></nav><button class="fab" id="fab"><span class="dot"></span><span>Support</span><b>↗</b></button><div class="toast" id="toast" role="status"></div>`;bindDashboard()}
function bindDashboard(){$('#deposit').onclick=deposit;$('#withdraw').onclick=withdraw;$('#fab').onclick=support;$('#support').onclick=support;$('#welcome-support').onclick=support;$('#logout').onclick=()=>{clearSession();renderAuth()};$('#notifications').onclick=()=>openModal(`<p class="kicker">NOTIFICATIONS</p><h2>Updates</h2>${notifications.map(note=>`<p>• ${note}</p>`).join('')}`);if($('#complete-task'))$('#complete-task').onclick=completeTask;if($('#locked-support'))$('#locked-support').onclick=deposit}
/* Wallet requests */
function deposit(){openModal(`<p class="kicker">WALLET / ADD FUNDS</p><h2>Make a deposit</h2><p class="notice">SANDBOX / FRONTEND PROTOTYPE · Balance will not increase automatically.</p><div class="field"><label>Payment method</label><select id="method"><option>bKash · account number configured later</option><option>Nagad · account number configured later</option><option>Rocket · account number configured later</option></select></div><div class="field"><label>Deposit amount</label><input id="amount" type="number" min="1" placeholder="e.g. 5,000"></div><div class="field"><label>Transaction ID</label><input id="reference" placeholder="Your payment reference"></div><button class="btn primary" id="submit-deposit">Submit deposit request <span>→</span></button>`);$('#submit-deposit').onclick=()=>{const amount=Number($('#amount').value),reference=$('#reference').value.trim();if(!amount||!reference)return toast('Amount and transaction ID are required.');deposits.push({amount,method:$('#method').value,reference,status:'pending',createdAt:new Date().toISOString()});wallet.pending+=amount;activity.push({type:'deposit',label:'Deposit request submitted',amount,status:'pending'});notifications.unshift('Your deposit request is pending.');saveState();closeModal();renderDashboard();toast('Deposit request submitted for verification.')}}
function withdraw(){openModal(`<p class="kicker">WALLET / SEND FUNDS</p><h2>Request a withdrawal</h2><p>Available balance: <strong>${money(wallet.balance)}</strong></p><div class="field"><label>Amount</label><input id="amount" type="number" min="1" max="${wallet.balance}" placeholder="e.g. 2,000"></div><div class="field"><label>Payment method</label><select id="method"><option>bKash</option><option>Nagad</option><option>Rocket</option></select></div><div class="field"><label>Destination number</label><input id="destination" type="tel" placeholder="01XXXXXXXXX"></div><button class="btn primary" id="submit-withdraw">Submit withdrawal request <span>→</span></button>`);$('#submit-withdraw').onclick=()=>{const amount=Number($('#amount').value),destination=$('#destination').value.trim();if(!amount||amount>wallet.balance)return toast('Insufficient wallet balance.');if(!/^01[3-9]\d{8}$/.test(destination))return toast('Enter a valid Bangladesh mobile number.');withdrawals.push({amount,method:$('#method').value,destination,status:'pending',createdAt:new Date().toISOString()});wallet.pending+=amount;activity.push({type:'withdrawal',label:'Withdrawal request submitted',amount,status:'pending'});notifications.unshift('Your withdrawal request is pending.');saveState();closeModal();renderDashboard();toast('Withdrawal request submitted for review.')}}
/* Task engine */
function completeTask(){const task=currentTask();if(!task||wallet.balance<task.requiredBalance)return;taskState.completed.push(task.title);wallet.balance+=task.reward;wallet.rewards+=task.reward;activity.push({type:'reward',label:`${task.title} completed`,amount:task.reward,status:'completed'});taskState.current++;notifications.unshift(taskState.current>=TASKS.length?'All tasks completed.':'Your next task is now available.');saveState();closeModal();renderDashboard();toast(taskState.current>=TASKS.length?'All tasks completed.':`${task.title} completed. Next task checked.`)}
function support(){openModal(`<p class="kicker">ASTERra SUPPORT</p><h2>Need help?</h2><div class="support-copy"><strong>Our support team is available on Telegram.</strong><p>Contact support for account or request questions.</p></div><button class="btn primary" id="telegram">Contact support <span>↗</span></button>`);$('#telegram').onclick=()=>window.open(TELEGRAM_SUPPORT_URL,'_blank','noopener,noreferrer')}
$('#close').onclick=closeModal;$('#modal').onclick=event=>{if(event.target.id==='modal')closeModal()};document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal()});
/* Initialization */
const initialize=()=>{try{renderDashboard()}catch(error){document.body.innerHTML='<main style="padding:40px;color:white"><h1>Asterra could not load</h1><p>Please refresh and try again.</p></main>';console.error(error)}};setTimeout(initialize,0);
})();
</script>
</body>
</html>
